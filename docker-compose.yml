services:
  db:
    image: postgres:18.6
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: bb
      POSTGRES_PASSWORD: myesto
      POSTGRES_DB: madb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
